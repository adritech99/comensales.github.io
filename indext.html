<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Cuentas 🍽️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Divisor de Cuentas</h1>

    <section>
        <h2>1. Comensales</h2>
        <div class="input-group">
            <input type="text" id="nombreComensal" placeholder="Nombre del comensal">
            <button onclick="agregarComensal()">Añadir Persona</button>
        </div>
        <div id="listaComensales" class="chip-container"></div>
    </section>

    <section>
        <h2>2. Platos y Raciones</h2>
        <div class="input-group">
            <input type="text" id="nombrePlato" placeholder="Ej: Pizza">
            <input type="number" id="precioPlato" placeholder="Precio unitario (€)" step="0.01">
            <input type="number" id="cantidadPlato" placeholder="Cantidad" value="1">
            <button onclick="agregarPlato()">Añadir</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Plato</th>
                    <th>Precio u.</th>
                    <th>Cant.</th>
                    <th>Total</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaPlatosBody"></tbody>
        </table>
    </section>

    <section>
        <h2>3. Distribución y Totales</h2>
        <div id="distribucion" class="distribucion-grid"></div>
        <hr>
        <div id="totalesFinales"></div>
    </section>
    
    <button onclick="limpiarTodo()" class="btn-danger">Borrar todo y empezar de nuevo</button>
</div>

<script src="script.js"></script>
</body>
</html>
